[package]
name = "wordcraft-inkwitness-review"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "InkWitness front end on WordCraft's egui app: records the writer's evidence into its DOCX, and the read-only /review/ replay of that history"

[lints]
workspace = true

[dependencies]
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-docx = { workspace = true }
wordcraft-inkwitness = { path = "../inkwitness" }
wordcraft-ui-egui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }

# The browser's clock and random ids for the recorder, and the review page's status region.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Crypto", "Performance", "CssStyleDeclaration"] }

